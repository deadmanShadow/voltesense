# VoltSense frontend CI.
#
# Runs on every push and PR against `main`. Three gates:
#   1. typecheck — `tsc -b --noEmit` under strict mode
#   2. tests     — `vitest run` (45 unit + integration tests)
#   3. build     — `vite build` to confirm production bundle compiles
#
# MUST (frontend.md §18 acceptance checklist).
name: frontend

on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Frontend/**"

jobs:
  ci:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (strict)
        run: npx tsc -b --noEmit

      - name: Tests
        run: npx vitest run --reporter=default

      - name: Build
        run: npx vite build

      - name: Bundle size budget
        run: |
          # The gzipped main bundle should stay under 250 KB. If we
          # ever cross that line we want a CI signal rather than a
          # silent regression.
          GZ_SIZE=$(stat -c %s dist/assets/index-*.js.gz 2>/dev/null || true)
          if [ -z "$GZ_SIZE" ]; then
            echo "No gzipped bundle found — skipping size check."
            exit 0
          fi
          if [ "$GZ_SIZE" -gt 256000 ]; then
            echo "::error::Bundle is $GZ_SIZE bytes (limit 256000)"
            exit 1
          fi
          echo "Bundle size OK: $GZ_SIZE bytes"
