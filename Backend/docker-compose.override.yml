# ============================================================================
# VoltSense — docker-compose.override.yml
# ----------------------------------------------------------------------------
# Automatically merged with docker-compose.yml when running
# `docker compose up` (without -f).
#
# Use this file for LOCAL DEVELOPMENT ONLY.
# Production uses `docker-compose.yml` alone (no override).
#
# What it does:
#   - forces a Development environment
#   - exposes Postgres on 127.0.0.1:5432 for psql / pgAdmin (already true
#     in the base file; repeated here for clarity)
# ============================================================================

services:

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  db:
    # Already exposed at 127.0.0.1:5432 in docker-compose.yml; kept here
    # so devs can adjust host port (e.g. "127.0.0.1:55432:5432") without
    # editing the production-ready file.
    ports:
      - "127.0.0.1:5432:5432"
